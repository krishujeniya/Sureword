<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="swShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="swWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="swCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.85" />
    </linearGradient>
    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
    <filter id="swCheckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Acoustic Soundwaves -->
  <path d="M 17 38 C 12 45 12 55 17 62" fill="none" stroke="url(#swWaveGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 10 30 C 2 42 2 58 10 70" fill="none" stroke="url(#swWaveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.65" />

  <!-- Right Acoustic Soundwaves -->
  <path d="M 83 38 C 88 45 88 55 83 62" fill="none" stroke="url(#swWaveGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 90 30 C 98 42 98 58 90 70" fill="none" stroke="url(#swWaveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.65" />

  <!-- Sovereign Clinical Shield Base -->
  <path d="M 50 12 L 74 22 C 74 54 50 82 50 82 C 50 82 26 54 26 22 Z" 
        fill="url(#swShieldGrad)" 
        filter="url(#swGlow)" />

  <!-- Inner Medical Cross Cutout -->
  <path d="M 45 28 H 55 V 39 H 66 V 49 H 55 V 63 H 45 V 49 H 34 V 39 H 45 Z" 
        fill="url(#swCrossGrad)" 
        opacity="0.22" />

  <!-- Verification Pulse Circle -->
  <circle cx="50" cy="46" r="17" fill="#0A2540" opacity="0.4" />

  <!-- Verified Checkmark ("Sure" mark) -->
  <path d="M 41 46 L 47 52 L 60 38" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#swCheckGlow)" />
</svg>

name: Sureword CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e ".[dev]"

      - name: Static linting (Ruff)
        run: |
          source .venv/bin/activate
          ruff check src tests scripts

      - name: Type checking (Mypy)
        run: |
          source .venv/bin/activate
          mypy src tests

      - name: Unit and Integration Tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

      - name: Dataset Manifest Integrity Check
        run: |
          source .venv/bin/activate
          python scripts/validate_manifest.py --dev data/manifests/dev.jsonl --test data/manifests/test.jsonl

      - name: Deterministic Benchmark Evaluation
        run: |
          source .venv/bin/activate
          python scripts/evaluate.py --config configs/experiment.json --manifest data/manifests/test.jsonl --output artifacts/ci_eval
